<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / 注册 | Phantom Aficionado</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Impact","Arial Black",sans-serif;letter-spacing:1px;}
body{
  background:#0a0a0a;
  color:#fff;
  background-image: radial-gradient(rgba(255,30,30,0.1) 1px, transparent 1px);
  background-size:28px 28px;
  min-height:100vh;
}
.nav{
  border-bottom:3px solid #ff2222;
  background:#080808;
  padding:18px 20px;
  position:sticky;
  top:0;
  z-index:99;
}
.nav-inner{
  max-width:1000px;
  margin:0 auto;
  display:flex;
  gap:30px;
  align-items:center;
  flex-wrap:wrap;
}
.nav a{
  color:#fff;
  text-decoration:none;
  font-size:18px;
  transition:0.2s;
}
.nav a:hover{color:#ff2222;}
.nav .logo{
  color:#ff2222;
  font-size:22px;
  font-weight:bold;
  margin-right:auto;
}
.user-box{
  margin-left:auto;
  color:#ff6666;
  font-size:16px;
}
.user-box a{color:#ff6666;font-size:16px;}

.container{
  max-width:500px;
  margin:60px auto;
  padding:0 20px;
}
.card{
  background:#141414;
  padding:35px;
  clip-path:polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
  border-left:5px solid #ff2222;
}
.tabs{
  display:flex;
  margin-bottom:30px;
  border-bottom:1px solid #333;
}
.tab{
  flex:1;
  text-align:center;
  padding:12px 0;
  cursor:pointer;
  color:#888;
  font-size:20px;
  transition:0.2s;
}
.tab.active{
  color:#ff2222;
  border-bottom:3px solid #ff2222;
}
.form-group{
  margin-bottom:22px;
}
label{
  display:block;
  margin-bottom:8px;
  color:#ff6666;
  font-size:16px;
}
input{
  width:100%;
  background:#1e1e1e;
  border:1px solid #444;
  color:#fff;
  padding:12px;
  font-size:16px;
  font-family:Arial,sans-serif;
  letter-spacing:normal;
}
.submit-btn{
  width:100%;
  background:#ff2222;
  border:none;
  color:#000;
  padding:14px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
  margin-top:10px;
}
.submit-btn:hover{background:#ff5555;}
.tip{
  margin-top:18px;
  color:#888;
  font-size:14px;
  text-align:center;
  font-family:Arial,sans-serif;
  letter-spacing:normal;
}
.form-panel{display:none;}
.form-panel.active{display:block;}

.footer{
  text-align:center;
  padding:30px 20px;
  color:#666;
  font-size:14px;
  border-top:1px solid #222;
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-inner">
    <div class="logo">PHANTOM</div>
    <a href="index.html">首页</a>
    <a href="request.html">提交请求</a>
    <a href="ranking.html">目标排行榜</a>
    <a href="message.html">留言墙</a>
    <a href="about.html">关于怪盗团</a>
    <div class="user-box" id="userBox">
      <a href="login.html">登录 / 注册</a>
    </div>
  </div>
</div>

<div class="container">
  <div class="card">
    <div class="tabs">
      <div class="tab active" data-tab="login">登 录</div>
      <div class="tab" data-tab="register">注 册</div>
    </div>

    <div class="form-panel active" id="loginPanel">
      <form id="loginForm">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="loginUser" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPass" required>
        </div>
        <button type="submit" class="submit-btn">登 录</button>
      </form>
    </div>

    <div class="form-panel" id="registerPanel">
      <form id="registerForm">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="regUser" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="regPass" required minlength="4">
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" id="regPass2" required>
        </div>
        <button type="submit" class="submit-btn">注 册</button>
      </form>
      <p class="tip">注册后数据仅保存在当前浏览器</p>
    </div>
  </div>
</div>

<div class="footer">
  © Phantom Aficionado Fan Site · 有兴趣加入怪盗团吗？
</div>

<script>
// Tab切换
document.querySelectorAll('.tab').forEach(tab=>{
   tab.addEventListener('click',()=>{
     document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
     document.querySelectorAll('.form-panel').forEach(p=>p.classList.remove('active'));
     tab.classList.add('active');
     document.getElementById(tab.dataset.tab+'Panel').classList.add('active');
   })
 })
 // 注册
 document.getElementById('registerForm').addEventListener('submit',async e=>{
   e.preventDefault();
   const u = document.getElementById('regUser').value.trim();
   const p1 = document.getElementById('regPass').value;
   const p2 = document.getElementById('regPass2').value;
   
   if(p1 !== p2){ alert('两次密码不一致'); return; }
   
   const res = await fetch('/api/register', {
     method: 'POST',
     headers: {'Content-Type': 'application/json'},
     body: JSON.stringify({ username: u, password: p1 })
   }).then(r=>r.json());
   
   if(res.success){
     alert('注册成功！请登录');
     document.querySelector('[data-tab="login"]').click();
   } else {
     alert(res.msg);
   }
 })
 // 登录
 document.getElementById('loginForm').addEventListener('submit',async e=>{
   e.preventDefault();
   const u = document.getElementById('loginUser').value.trim();
   const p = document.getElementById('loginPass').value;
   
   const res = await fetch('/api/login', {
     method: 'POST',
     headers: {'Content-Type': 'application/json'},
     body: JSON.stringify({ username: u, password: p })
   }).then(r=>r.json());
   
   if(res.success){
     localStorage.setItem('phantom_login', JSON.stringify(res.user));
     alert('登录成功！');
     window.location.href = 'index.html';
   } else {
     alert(res.msg);
   }
 })
 // 登录状态检查
 function checkLogin(){
   const login = localStorage.getItem('phantom_login');
   if(login){
     const user = JSON.parse(login);
     let adminTip = user.role === 'admin' ? ' <a href="admin.html" style="color:#ff2222;">管理后台</a> |' : '';
     document.getElementById('userBox').innerHTML = 
       `<span>${user.username}</span>${adminTip} | <a href="javascript:logout()" style="color:#ff6666;">退出</a>`;
   }
 }
 function logout(){
   localStorage.removeItem('phantom_login');
   location.reload();
 }
 checkLogin();
 </script>
 </body>
 </html>
